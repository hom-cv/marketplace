<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #1a1a1a; max-width: 600px; margin: 0 auto; padding: 24px; background-color: #fafafa;">
    <div style="background: #ffffff; border-radius: 4px; border: 1px solid #eeeeee; overflow: hidden;">
        <div style="padding: 32px 32px 0 32px;">
            <h1 style="color: #1a1a1a; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;">tallad.co</h1>
        </div>
        <div style="padding: 24px 32px 32px 32px;">
            <p style="font-size: 16px; margin: 0 0 16px 0; color: #1a1a1a;">Hi {{ first_name }},</p>
            <p style="font-size: 16px; margin: 0 0 24px 0; color: #666666;">
                Welcome to tallad.co. Please verify your email address to start buying and selling.
            </p>
            <div style="margin: 32px 0;">
                <a href="{{ verification_url }}" style="background: #2443ff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: 500; font-size: 14px; display: inline-block;">
                    Verify email
                </a>
            </div>
            <p style="font-size: 14px; color: #666666; margin: 0 0 8px 0;">
                Or paste this link into your browser:
            </p>
            <p style="font-size: 13px; color: #999999; word-break: break-all; margin: 0 0 24px 0;">
                {{ verification_url }}
            </p>
            <p style="font-size: 14px; color: #999999; margin: 0;">
                This link expires in 24 hours.
            </p>
        </div>
        <div style="background: #fafafa; padding: 16px 32px; border-top: 1px solid #eeeeee;">
            <p style="font-size: 12px; color: #999999; text-align: center; margin: 0;">
                If you didn't create an account, you can safely ignore this email.
            </p>
        </div>
    </div>
</body>
</html>
