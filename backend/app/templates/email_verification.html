<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #fafafa"
    >
      <tr>
        <td align="center" style="padding: 24px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              width: 100%;
              background: #ffffff;
              border: 1px solid #eeeeee;
              border-radius: 4px;
            "
          >
            <tr>
              <td style="padding: 32px 32px 0 32px">
                <h1
                  style="
                    color: #1a1a1a;
                    margin: 0;
                    font-size: 24px;
                    font-weight: 700;
                    letter-spacing: -0.01em;
                  "
                >
                  tallad.co
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 32px 32px">
                <p style="font-size: 16px; margin: 0 0 16px 0; color: #1a1a1a">
                  Hi {{ first_name }},
                </p>
                <p style="font-size: 16px; margin: 0 0 24px 0; color: #1a1a1a">
                  Welcome to tallad.co. Please verify your email address to
                  start buying and selling.
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin: 32px 0"
                >
                  <tr>
                    <td style="background: #2443ff; border-radius: 4px">
                      <a
                        href="{{ verification_url }}"
                        style="
                          background: #2443ff;
                          color: #ffffff;
                          padding: 12px 24px;
                          text-decoration: none;
                          border-radius: 4px;
                          font-weight: 500;
                          font-size: 14px;
                          display: inline-block;
                        "
                      >
                        Verify email
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="font-size: 14px; color: #1a1a1a; margin: 0 0 8px 0">
                  Or paste this link into your browser:
                </p>
                <p
                  style="
                    font-size: 13px;
                    word-break: break-all;
                    margin: 0 0 24px 0;
                  "
                >
                  <a
                    href="{{ verification_url }}"
                    style="color: #999999; text-decoration: none"
                    >{{ verification_url }}</a
                  >
                </p>
                <p style="font-size: 14px; color: #999999; margin: 0">
                  This link expires in 24 hours.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #fafafa;
                  padding: 16px 32px;
                  border-top: 1px solid #eeeeee;
                "
              >
                <p
                  style="
                    font-size: 12px;
                    color: #999999;
                    text-align: center;
                    margin: 0;
                  "
                >
                  If you didn't create an account, you can safely ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
